# Example config for BresenhamStrategy, with every key at its default value.
# Usage: ./scripts/run.sh Bresenham --config config/bresenham.ini
#        ./scripts/match.sh Bresenham --config config/bresenham.ini
#
# Sections group each evaluator's keys so the same key name can repeat across
# sections without colliding. [General] holds weights shared by evaluators.
type=Bresenham

[General]
# Own-channel headroom weight: value = OWN_WEIGHT*(255 - ourColour) + enemyStrip. Non-negative —
# our own colour just yields 0 (no reward), never a penalty. To favour foreign colour, raise the
# enemy weights below rather than this.
OWN_WEIGHT=5.0
# Leader-scaled enemy weighting: strip weight per opponent = ENEMY_BASE + LEADER_SCALE*(score/maxOppScore),
# so the currently-winning opponent is targeted hardest.
ENEMY_BASE=1
LEADER_SCALE=8.0

[Raycast]
DIRECTION_COUNT=32
# LINE_LENGTH is the MINIMUM ray length in px (the slowest bot); faster bots reach proportionally
# farther (length *= speed/slowestSpeed). FALLOFF_SLOPE is the slowest bot's linear falloff per px;
# faster bots get a flatter falloff (they weigh far pixels more). SPEED_SCALING=0 makes all bots
# identical; 1 is fully speed-proportional.
LINE_LENGTH=300
FALLOFF_SLOPE=0.005
SPEED_SCALING=1.0
# Re-cast the rays every this many ticks; the heading is held in between (also re-cast early, any
# tick, if it would drive into a wall).
RECHECK_INTERVAL_TICKS=15

[Walls]
WALL_GRID_SCALE=4          # 1024 / 4 = 256-cell wall grid
WALL_RADIUS_PX=16           # thicken walls by this on init (keeps bots off walls)
MIN_WALL_DISTANCE_PX=30    # a ray hitting a wall closer than this is disqualified (-infinity)

[PaintValue]
WEIGHT=2.0                 # this evaluator's outer weight (relative to future evaluators)
GRID_SCALE=4               # 1024 / 8 = 128-cell value grid (cheap blur)
BLUR_ITERATIONS=8          # plain box-blur passes — "thickens" the ray so it picks up nearby colour

[BotDistance]
# On-demand evaluator (no grid): score = Σ weight * sqrt(distance) to every OTHER bot, so open
# space far from bots scores higher. Separate weights for our own teammates vs. enemy bots.
WEIGHT=5.0                 # this evaluator's outer weight (relative to PaintValue)
OWN_TEAM_WEIGHT=10.0        # spread out from our own 2 other bots
ENEMY_TEAM_WEIGHT=0.5      # keep clear of (or, if negative-leaning via low weight, contest) enemy bots

[CenterPull]
# Static circular field pulling bots toward the board centre (counters edge-hugging). Constant
# INNER_REWARD within INNER_RADIUS_PX, constant OUTER_REWARD beyond OUTER_RADIUS_PX, linearly
# interpolated between. Keep both rewards >= 0. Board centre is 512,512; playable radius ~512.
WEIGHT=30.0
INNER_RADIUS_PX=100
OUTER_RADIUS_PX=800
INNER_REWARD=100
OUTER_REWARD=50

[Powerups]
ENABLED=true
SEARCH_RADIUS_PX=1000       # how close a powerup must be for a bot to consider it
MAX_PATH_DIST=1000          # give up on a powerup beyond this path distance
RACE_MARGIN=1.0            # go only if our path <= opponents' straight-line distance * this
BOMB_BASE_VALUE=400
BOMB_TURF_SCALE=0.5        # extra bomb value proportional to paint value already at its spot
RAIN_VALUE=500
