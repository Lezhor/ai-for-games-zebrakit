# Example config for TerritoryDiffusionStrategy, with every key at its default value.
# Usage: ./scripts/run.sh TerritoryDiffusion --config config/territory-diffusion.ini
#        ./scripts/match.sh TerritoryDiffusion --config config/territory-diffusion.ini
type=TerritoryDiffusion

# --- Opponent targeting (score-margin bump spread; see OpponentWeights) ---
SIGMA_MAX=0.1
SIGMA_MIN=0.04

# --- Coarse influence map (area selection) ---
INFLUENCE_GRID_SIZE=64
DIFFUSION_ITERATIONS=5
DIFFUSION_ALPHA=0.8
CROWD_STRENGTH=0.8
DISPERSION_SIGMA=12.0
# Per-role distance falloff: bot0 (fast) roams far cheaply, bot2 (slow) prefers nearby.
DISTANCE_ALPHA=0.008,0.035,0.055

# --- Fine local field (steering) ---
# Window radius in px = FINE_WINDOW_RADIUS_CELLS * FINE_CELL_PX (both are in different units!
# FINE_CELL_PX is the size of one sampled cell in board pixels, FINE_WINDOW_RADIUS_CELLS is how
# many of those cells out from the bot the window extends). 10 * 20 = 200px, as requested — this
# is "how far around itself a bot looks to pick which nearby color to drift toward."
FINE_WINDOW_RADIUS_CELLS=10
FINE_CELL_PX=20
FINE_DIFFUSION_ITERS=3
FINE_DIFFUSION_ALPHA=0.6
SEEK_VALUE_WEIGHT=1.2
SEPARATION_WEIGHT=0.4
SEPARATION_RADIUS_PX=100
# Cells closer than this multiplier * a bot's own paint radius are ramped down toward zero
# weight (linearly, not a hard cutoff — a hard ring boundary is itself orbitable and can trap
# a bot circling it). 0 disables the ramp.
LOCAL_MIN_RADIUS_MULTIPLIER=2.0
# How much our own channel's headroom is weighted vs. opponent-strip value (see TerritoryUtils):
# zero on an already-white cell, largest on a fully enemy-owned one — raise this to target enemy
# territory much more aggressively over neutral white space.
OWN_GAIN_WEIGHT=4.0
# Directional-consistency bonus: a cell roughly in the same direction as last tick's local pick
# gets (1 + this)x weight, tapering to 1x for a cell perpendicular/behind. Without this, the local
# centroid can keep re-picking whichever side of an already-painted patch still has the most
# remaining value, tracing its rim in a circle instead of committing to a direction. 0 disables it.
LOCAL_PERSISTENCE_STRENGTH=2.0

# --- Micro-dominant blend (area target as a soft leash) ---
# The coarse area target should matter much less than local movement (per design): it contributes
# ZERO pull within AREA_RADIUS_PX of the area, ramping up only beyond that, up to MACRO_GAIN at
# AREA_RADIUS_PX + LEASH_RANGE_PX away. All three are widened/softened from earlier defaults so
# local movement dominates over a much bigger area.
MICRO_WEIGHT=1.0
AREA_RADIUS_PX=150
LEASH_RANGE_PX=350
MACRO_GAIN=1.2

# --- Wall avoidance (applied to EVERY bot's final direction) ---
WALL_AVOID_RADIUS_PX=48
WALL_AVOID_RAY_COUNT=12
WALL_AVOID_STEP_PX=6
WALL_AVOID_WEIGHT=4.0
# How long (ms) the turn-rate clamp stays disabled after a wall push last fired, even once it
# reads zero again. Without this, the clamp re-engages the instant the bot drifts back outside
# WALL_AVOID_RADIUS_PX, dragging it slowly back toward the wall (wherever the target still points),
# which re-triggers escape a moment later — a sawtooth at the wall edge that looks like wiggling.
WALL_ESCAPE_COOLDOWN_MS=250

# --- Turn-rate limiting, per bot (bot0,bot1,bot2), degrees/second. 0 disables a bot's clamp. ---
# Bypassed automatically near a wall or while chasing a powerup.
MAX_TURN_DEG_PER_SEC=150,360,200

# --- Area commitment ---
TARGET_COMMIT_MS=300
ARRIVAL_RADIUS_PX=40
AREA_ABANDON_VALUE=300

# --- Path caching ---
PATH_DRIFT_THRESHOLD_PX=60
PATH_RECOMPUTE_TICKS=20

# --- Powerups ---
# How far a bot will look for a powerup worth going for (in px). This is the closest thing to a
# "big radius" that currently exists as an explicit setting — bumped toward your ~700px ask. If
# you actually meant the coarse area-selection reach instead, that one has no hard radius today
# (it's the whole 1024px map with a per-role distance falloff via DISTANCE_ALPHA above) — say so
# and I'll add an explicit cutoff for it too.
POWERUP_SEARCH_RADIUS_PX=700
POWERUP_MAX_PATH_DIST=700
RACE_MARGIN=1.0
BOMB_BASE_VALUE=400
BOMB_TURF_SCALE=0.5
RAIN_VALUE=500
